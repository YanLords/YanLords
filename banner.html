<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0D100F;
    --white:#F5F0EF;
    --white-rgb:245,240,239;
    --gray-mid:#333333;
    --gray-light:#C4C4C4;
    --accent:#c07a45;
    --accent-soft:rgba(192,122,69,.16);
    --blue:#7985ff;
    --yellow:#f4b400;
    --font-sans:'Manrope','Helvetica Neue',Arial,sans-serif;
    --font-mono:'IBM Plex Mono','Courier New',monospace;
    --font-display:'Instrument Serif','Times New Roman',serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:300px;overflow:hidden}
  body{background:var(--black);color:var(--white);font-family:var(--font-sans);position:relative}

  .grid{
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(var(--white-rgb),.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(var(--white-rgb),.045) 1px, transparent 1px);
    background-size:60px 60px;
  }
  .scan{
    position:absolute;inset:0;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
  }
  .glow{position:absolute;right:-140px;top:-160px;width:540px;height:540px;
    background:radial-gradient(circle, var(--accent-soft) 0%, transparent 68%)}
  .frame{position:absolute;inset:14px;border:1px solid rgba(var(--white-rgb),.13)}

  .stage{
    position:absolute;left:0;right:0;top:0;bottom:52px;
    display:grid;grid-template-columns:auto 1px 1fr;
    align-items:center;gap:36px;
    padding:0 54px;
  }
  .mark{display:flex;align-items:center;justify-content:center;width:146px}
  .mark img{width:118px;height:auto;display:block}
  .rule{width:1px;height:138px;
    background:linear-gradient(to bottom, transparent, rgba(var(--white-rgb),.3) 20%, rgba(var(--white-rgb),.3) 80%, transparent)}

  .txt{display:flex;flex-direction:column;gap:11px;min-width:0}
  .eyebrow{
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);display:flex;align-items:center;gap:11px;
  }
  .eyebrow::before{content:'';display:block;width:24px;height:1px;background:var(--accent)}
  .name{
    font-family:var(--font-sans);font-weight:800;font-size:57px;line-height:.93;
    letter-spacing:-.055em;text-transform:uppercase;
    text-shadow:-2.5px 0 rgba(121,133,255,.42), 2.5px 0 rgba(244,180,0,.30);
  }
  .name .thin{font-weight:300;letter-spacing:-.025em}
  .role{
    font-family:var(--font-display);font-style:italic;font-size:24px;line-height:1.05;
    color:var(--gray-light);margin-top:2px;
  }
  .role b{font-style:normal;font-family:var(--font-sans);font-weight:700;color:var(--accent);letter-spacing:-.005em}

  .foot{
    position:absolute;left:54px;right:54px;bottom:26px;
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--font-mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(var(--white-rgb),.45);
  }
  .foot .accent{color:var(--accent)}
  .right{display:flex;align-items:center;gap:16px}
  .dots{display:flex;gap:6px;align-items:center}
  .dots i{width:6px;height:6px;display:block}
  .dots i:nth-child(1){background:#ff6b35}
  .dots i:nth-child(2){background:var(--yellow)}
  .dots i:nth-child(3){background:var(--blue)}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="scan"></div>
  <div class="frame"></div>

  <div class="stage">
    <div class="mark"><img src="yd_Logo_Blanc.svg" alt="Yandesign"></div>
    <div class="rule"></div>
    <div class="txt">
      <div class="eyebrow">Yandesign — studio</div>
      <div class="name">Yannick<br><span class="thin">Simoens</span></div>
      <div class="role">Directeur artistique junior · <b>Planete Pyro Dist.</b></div>
    </div>
  </div>

  <div class="foot">
    <span class="accent">Design — outils maison — pyrotechnie</span>
    <span class="right">
      <span class="dots"><i></i><i></i><i></i></span>
      <span>yandesign.fr</span>
    </span>
  </div>
</body>
</html>
